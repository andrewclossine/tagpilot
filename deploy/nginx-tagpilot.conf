# For a server that already runs nginx (for example for hrleave.com).
# Copy to /etc/nginx/sites-available/tagpilot, replace tagpilot.example.com with your domain,
# link it into sites-enabled, then run: sudo certbot --nginx -d tagpilot.example.com -d www.tagpilot.example.com
server {
    listen 80;
    server_name tagpilot.example.com www.tagpilot.example.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
